<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // SPA redirect restore for GitHub Pages
      // Reads the encoded path set by 404.html and restores it via history.replaceState.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <link rel="icon" type="image/png" href="/favicon-96x96.png?v=0.1" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=0.1" />
    <link rel="shortcut icon" href="/favicon.ico?v=0.1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=0.1" />
    <meta name="apple-mobile-web-app-title" content="SportsSimulate" />
    <link rel="manifest" href="/site.webmanifest?v=0.1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SportsSimulate</title>
    <script>
      // Apply the persisted (or default) theme before first paint to avoid a
      // light-mode flash on load. Kept in sync with ThemeContext's logic.
      (function () {
        var stored = localStorage.getItem('cfb-theme');
        var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
